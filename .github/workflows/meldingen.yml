name: Meldingen

# Elk half uur kijkt dit of er een herinnering verstuurd moet worden.
# De tijden staan in je meldingscode (meldingen/codes.txt), in Nederlandse tijd.
# Verandert codes.txt, dan volgt direct een testmelding.
on:
  push:
    branches: [main]
    paths: ["meldingen/codes.txt", ".github/workflows/meldingen.yml", "scripts/**"]
  schedule:
    - cron: "1 * * * *"
    - cron: "31 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Stuur nu een testmelding"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: meldingen
  cancel-in-progress: false

jobs:
  versturen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Het sleutelpaar wordt één keer gemaakt en daarna uit de Actions-cache gehaald.
      # De geheime helft komt nooit in de repository.
      - name: Sleutels ophalen
        id: keys
        uses: actions/cache/restore@v4
        with:
          path: .vapid
          key: vapid-v1
      - name: Codesleutel ophalen
        id: box
        uses: actions/cache/restore@v4
        with:
          path: .box
          key: box-v1
      - name: Sleutels maken of controleren
        run: node scripts/keys.mjs
      - name: Sleutels bewaren
        if: steps.keys.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vapid
          key: vapid-v1
      - name: Codesleutel bewaren
        if: steps.box.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .box
          key: box-v1
      - name: Publieke sleutel publiceren
        run: |
          git add meldingen/vapid-public.txt meldingen/box-public.txt
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publieke sleutel voor meldingen bijwerken"
            git pull --rebase origin main && git push origin HEAD:main
          fi

      - name: Herinneringen versturen
        run: node scripts/send.mjs
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
          SCHEDULE: ${{ github.event.schedule }}
          FORCE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.test) }}

      # GitHub zet geplande taken uit na 60 dagen zonder activiteit in de repository.
      # Op de 1e en 15e van de maand maakt deze stap daarom een kleine commit.
      - name: Actief houden
        if: github.event.schedule == '1 * * * *'
        run: |
          if [ "$(date -u +%H)" = "03" ] && { [ "$(date -u +%d)" = "01" ] || [ "$(date -u +%d)" = "15" ]; }; then
            date -u +%F > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "Geplande meldingen actief houden" || true
            git pull --rebase origin main && git push origin HEAD:main || true
          fi
